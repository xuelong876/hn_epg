name: Sync EPG to Gitee

on:
  schedule:
    # 北京时间 2:05 = UTC 18:05（前一天）
    - cron: '5 18 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出 GitHub 仓库（拿到 sync_epg_xml.py 和 epg.xml 源文件）
      - name: Checkout GitHub repo
        uses: actions/checkout@v4

      # 2. 安装 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装依赖
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests 
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. 运行 Python 脚本，生成新的 EPG 文件
      #    假设脚本输出到当前目录，比如 epg_filtered.xml 或 epg_filtered.xml.gz
      - name: Run sync_epg_xml.py
        run: python sync_epg_xml.py

      # 5. 克隆 Gitee 目标仓库到 repo/ 目录
      - name: Checkout Gitee repo
        env:
          GITEE_USER: xuelong88
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          git config --global credential.helper store
          git clone "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/xuelong88/hn_epg.git" repo
          cd repo
          git config user.name "GitHub Action Sync"
          git config user.email "actions@github.com"

      # 6. 把生成的文件复制到 Gitee 仓库目录里
      #    根据你脚本实际输出文件名修改下面 cp 命令
      - name: Copy generated files into Gitee repo
        run: |
         
          cp epg_henan.xml.gz    repo/ 2>/dev/null || true
          # 或者直接整个目录复制，比如：
          # cp -r output/* repo/

      # 7. 检查是否有变更
      - name: Check changes
        id: check
        run: |
          cd repo
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "没有变更，跳过推送"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git status --short
          fi

      # 8. 提交并推送到 Gitee
      - name: Push to Gitee
        env:
          GITEE_USER: xuelong88
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        if: steps.check.outputs.changed == 'true'
        run: |
          cd repo
          git commit -m "github Auto sync EPG $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/xuelong88/hn_epg.git" HEAD:master
